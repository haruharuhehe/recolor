name: build tweak

on:
  push:
  workflow_dispatch:

env:
  THEOS: /home/runner/theos
  THEOS_MAKE_PATH: /home/runner/theos/makefiles

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl file unzip xz-utils fakeroot libxml2-utils

      - name: cache theos
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: theos-linux-v2

      - name: install theos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "$THEOS/makefiles" ] && [ -d "$THEOS/sdks" ]; then
            echo "theos already cached"
            ls "$THEOS/sdks"
            exit 0
          fi
          # the installer talks to api.github.com, which rate-limits shared
          # runner IPs, so give it a few goes before giving up.
          for i in 1 2 3 4 5; do
            echo "== attempt $i =="
            echo "y" | bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" && break
            echo "attempt $i failed, waiting 25s"
            sleep 25
          done
          if [ ! -d "$THEOS/makefiles" ]; then
            echo "::error::theos install failed after 5 attempts"
            exit 1
          fi
          ls "$THEOS/sdks"

      - name: build
        run: |
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0

      - name: show result
        run: |
          ls -la packages/
          find .theos/obj -name 'recolor.dylib' -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: recolor
          if-no-files-found: error
          path: |
            packages/*.deb
            .theos/obj/**/recolor.dylib
